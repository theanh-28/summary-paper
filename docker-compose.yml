services:
  db:
    image: mysql:8
    container_name: summary_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: summary_paper
      MYSQL_USER: summary_user
      MYSQL_PASSWORD: summary_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    container_name: summary_backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env.docker
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    command: sh -c "alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    container_name: summary_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Tránh lỗi ghi đè thư mục node_modules từ máy thật vào docker
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: summary_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: summary_user
      PMA_PASSWORD: summary_pass
    depends_on:
      - db

  metabase:
    image: metabase/metabase:latest
    container_name: summary_metabase
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Metabase internal DB (H2) — cấu hình mặc định
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      # Embedding secret — dùng để ký JWT cho embedded dashboards
      MB_EMBEDDING_SECRET_KEY: "your-metabase-secret-key-change-in-production"
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      - db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
  metabase_data:
  backend_uploads:
