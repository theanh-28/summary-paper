services:
  # ===========================================================================
  # MySQL — Application DB + Metabase Metadata DB
  # ===========================================================================
  db:
    image: mysql:8
    container_name: summary_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: summary_paper         # Application DB (tự tạo bởi Docker MySQL)
      MYSQL_USER: summary_user
      MYSQL_PASSWORD: summary_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro              # Tạo metabase_appdb
      - ./database/metabase_restore.sql:/docker-entrypoint-initdb.d/02-restore.sql:ro  # Restore dashboards (nếu đã export)
      - ./database/database_restore.sql:/docker-entrypoint-initdb.d/03-database_restore.sql:ro  # Restore seed data
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Backend — FastAPI + Alembic
  # ===========================================================================
  backend:
    build: ./backend
    container_name: summary_backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env.docker
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    command: sh -c "sleep 15 && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Frontend — React (Vite dev server)
  # ===========================================================================
  frontend:
    build: ./frontend
    container_name: summary_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # phpMyAdmin — Database management UI
  # ===========================================================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: summary_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: summary_user
      PMA_PASSWORD: summary_pass
    depends_on:
      - db

  # ===========================================================================
  # Metabase — Analytics & Dashboard Engine
  #
  # Dùng MySQL (metabase_appdb) thay vì H2 cho metadata storage.
  # Lý do: H2 dễ corrupt khi container restart đột ngột.
  #         MySQL đáng tin cậy hơn cho production.
  # ===========================================================================
  metabase:
    image: metabase/metabase:latest
    container_name: summary_metabase
    restart: always
    ports:
      - "3000:3000"
    environment:
      # --- Metabase Application Database (metadata storage) ---
      MB_DB_TYPE: mysql
      MB_DB_DBNAME: metabase_appdb
      MB_DB_PORT: 3306
      MB_DB_USER: summary_user
      MB_DB_PASS: summary_pass
      MB_DB_HOST: db
      # --- Embedding ---
      MB_EMBEDDING_SECRET_KEY: "my-super-secret-metabase-embedding-key-32chars"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s    # Metabase cần ~60-120s để khởi động lần đầu
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


volumes:
  db_data:               # MySQL data — persist qua docker compose down
  backend_uploads:       # Uploaded PDF files
  frontend_node_modules: